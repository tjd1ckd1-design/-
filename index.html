<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>국가는 지금 어디로 가고 있나 | 법안·국정과제 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#1B4B8F;
    --primary-dark:#123564;
    --primary-tint:#E8F0FC;
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --border:#DFE2E6;
    --border-strong:#C7CBD1;
    --text:#20242B;
    --text-soft:#5A6270;
    --text-mute:#8A919C;
    --success:#1D7A45;
    --success-tint:#E8F5EC;
    --muted-tint:#EEF0F2;
    --dropped:#8B4A3D;
    --dropped-tint:#F1E6E2;
    --radius:8px;
    --radius-sm:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    line-height:1.55;
    min-height:100vh;
    font-size:15px;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 80px;}

  /* ---------- header ---------- */
  header.top{padding:40px 0 26px;}
  .eyebrow{
    font-size:12.5px; color:var(--primary); font-weight:700; letter-spacing:.02em; margin:0 0 12px;
  }
  h1.title{
    font-weight:900; font-size:clamp(26px,3.6vw,36px); margin:0 0 12px; letter-spacing:-.01em;
    color:var(--text); line-height:1.3;
  }
  .lede{color:var(--text-soft); font-size:14.5px; max-width:640px; margin:0 0 20px;}

  /* ---------- stat row ---------- */
  .stat-ledger{
    margin-top:22px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); overflow:hidden;
  }
  .stat-cell{padding:16px 20px; border-right:1px solid var(--border); border-left:3px solid var(--primary);}
  .stat-cell:first-child{border-left:none;}
  .stat-cell:last-child{border-right:none;}
  .stat-num{font-weight:700; font-size:24px; color:var(--text); font-variant-numeric:tabular-nums;}
  .stat-num small{font-size:12.5px; color:var(--text-mute); margin-left:3px; font-weight:500;}
  .stat-label{font-size:12px; color:var(--text-soft); margin-top:5px;}

  /* ---------- 결재선 (approval-line) stepper ---------- */
  .approval-line{display:flex; gap:3px; overflow-x:auto; padding-bottom:2px;}
  .approval-cell{display:flex; flex-direction:column; align-items:center; min-width:82px; flex-shrink:0;}
  .approval-box{
    width:100%; height:30px; border:1.5px solid var(--border-strong); background:#fff; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12px; color:var(--text-mute); font-variant-numeric:tabular-nums;
  }
  .approval-cell.done .approval-box{background:var(--primary); border-color:var(--primary); color:#fff;}
  .approval-label{font-size:11px; color:var(--text-soft); text-align:center; margin-top:6px; padding:0 2px;}
  .approval-cell.done .approval-label{color:var(--text); font-weight:700;}
  .approval-date{font-size:10px; color:var(--text-mute); margin-top:2px; font-variant-numeric:tabular-nums;}

  /* ---------- hero: 다가오는 변화 ---------- */
  .hero{margin-top:38px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .section-head h2{font-size:17px; margin:0; font-weight:700;}
  .section-head .tag{
    font-size:12px; color:var(--success); background:var(--success-tint);
    border-radius:20px; padding:3px 10px; font-weight:700;
  }
  .ledger-list{border-top:1px solid var(--border); margin-top:14px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden;}
  .ledger-row{
    display:flex; align-items:flex-start; gap:16px; padding:16px 18px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row:hover{background:var(--bg);}
  .ledger-code{
    font-size:13px; color:var(--primary); font-weight:700;
    flex-shrink:0; width:30px; padding-top:1px; font-variant-numeric:tabular-nums;
  }
  .ledger-body{flex:1; min-width:0;}
  .ledger-title{font-weight:700; font-size:15px; color:var(--text); margin-bottom:4px; line-height:1.4;}
  .ledger-next{font-size:12.5px; color:var(--text-soft);}
  .ledger-next b{color:var(--primary-dark); font-weight:700;}
  .ledger-empty{padding:30px 16px; text-align:center; color:var(--text-mute); font-size:13.5px;}

  /* ---------- controls ---------- */
  .controls{margin-top:44px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .search-box{
    flex:1; min-width:220px; display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--border-strong); border-radius:var(--radius-sm);
    padding:9px 13px;
  }
  .search-box input{border:none; outline:none; background:transparent; width:100%; font-family:inherit; font-size:14px; color:var(--text);}
  .search-box svg{flex-shrink:0; color:var(--text-mute);}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  select{
    font-family:inherit; font-size:13.5px; color:var(--text); background:var(--card);
    border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:8px 11px; cursor:pointer;
  }
  .tabs{display:flex; gap:4px; border-bottom:2px solid var(--border); margin-top:18px;}
  .tab{
    font-size:13.5px; font-weight:600; padding:10px 16px; cursor:pointer;
    color:var(--text-soft); user-select:none; border-bottom:2px solid transparent; margin-bottom:-2px;
  }
  .tab.active{color:var(--primary); border-bottom-color:var(--primary);}

  /* ---------- grid & cards ---------- */
  .grid{margin-top:18px; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:.12s ease; overflow:hidden;}
  .card:hover{border-color:var(--primary); box-shadow:0 0 0 1px var(--primary);}
  .card-strip{height:3px; background:var(--primary);}
  .card-body{padding:17px 18px;}
  .card-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:9px;}
  .meta-line{font-size:12px; color:var(--text-mute); font-weight:500;}

  .badge{
    display:inline-flex; align-items:center; font-size:11.5px; font-weight:700;
    padding:3px 10px; border-radius:20px; white-space:nowrap;
  }
  .badge-progress{background:var(--primary-tint); color:var(--primary-dark);}
  .badge-floor{background:var(--primary); color:#fff;}
  .badge-done{background:var(--success-tint); color:var(--success);}
  .badge-dropped{background:var(--muted-tint); color:var(--text-mute);}

  .card h3{font-size:15px; font-weight:700; margin:0 0 7px; line-height:1.4;}
  .card p.summary{font-size:13px; color:var(--text-soft); margin:0 0 13px; line-height:1.55;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  .progress-meta{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-mute); margin-bottom:11px; font-variant-numeric:tabular-nums;}

  .mini-stages{display:flex; gap:3px; margin-bottom:13px;}
  .mini-stages .seg{flex:1; height:4px; border-radius:2px; background:var(--muted-tint);}
  .mini-stages .seg.on{background:var(--primary);}

  .card-foot{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--text-mute); border-top:1px solid var(--border); padding-top:11px;}

  .empty{grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--text-mute);}
  .empty b{display:block; font-size:15px; color:var(--text); margin-bottom:5px;}

  /* ---------- detail page ---------- */
  .detail-page{margin-top:32px; max-width:740px;}
  .back-btn{
    font-size:13px; font-weight:600; color:var(--text-soft);
    background:none; border:none; cursor:pointer; padding:6px 0 18px; display:inline-flex; align-items:center;
  }
  .back-btn:hover{color:var(--primary);}
  .detail-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .detail-title{font-size:22px; font-weight:900; margin:0 0 20px; line-height:1.4;}
  .detail-meta-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:16px 18px; margin-bottom:26px;
  }
  .detail-meta-grid .dl{display:block; font-size:11.5px; color:var(--text-mute); margin-bottom:3px;}
  .detail-meta-grid .dv{display:block; font-size:13.5px; color:var(--text); font-weight:600;}
  .detail-page .approval-line{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px 16px; margin-bottom:26px;}
  .detail-section{margin-bottom:26px;}
  .detail-section h3{font-size:14px; font-weight:700; margin:0 0 10px; color:var(--text);}
  .detail-section p{font-size:13.5px; color:var(--text-soft); line-height:1.7; margin:0;}
  .keypoints{margin:0; padding-left:18px; font-size:13.5px; color:var(--text-soft); line-height:1.9;}
  .keypoints li{margin-bottom:2px;}
  .history-list{list-style:none; margin:0; padding:0; border-left:2px solid var(--border); padding-left:16px;}
  .history-list li{position:relative; padding-bottom:16px; font-size:13px;}
  .history-list li::before{content:""; position:absolute; left:-20.5px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--primary); border:2px solid var(--card);}
  .history-list .hdate{font-variant-numeric:tabular-nums; color:var(--text-mute); margin-right:10px;}
  .history-list .hlabel{font-weight:700; color:var(--text); margin-right:8px;}
  .history-list .hnote{color:var(--text-soft);}

  footer.pagefoot{margin-top:56px; padding-top:20px; border-top:1px solid var(--border); font-size:12px; color:var(--text-mute); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  footer.pagefoot a{color:var(--text-soft);}

  @media(max-width:760px){
    .controls{flex-direction:column; align-items:stretch;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <p class="eyebrow">법안 진행 현황 · 국정과제 추적 — 매일 자동 갱신</p>
    <h1 class="title">국가는 지금 어디로 가고 있나</h1>
    <p class="lede">국회에 계류 중인 법안이 지금 어느 단계에 있는지, 정부가 5년간 추진하겠다고 밝힌 국정과제가 어떻게 진행되는지를 한 곳에서 자동으로 추적합니다.</p>

    <div class="stat-ledger" id="statBoard"></div>
  </header>

  <section class="hero">
    <div class="section-head">
      <h2>다가오는 변화</h2>
      <span class="tag">곧 다음 단계로 넘어갈 것으로 보이는 항목</span>
    </div>
    <div id="heroCard"></div>
  </section>

  <div id="listView">
  <div class="controls">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="키워드로 검색 (예: 플랫폼, 에너지, 인구)" />
    </div>
    <div class="filters">
      <select id="categoryFilter"><option value="all">전체 분야</option></select>
      <select id="statusFilter">
        <option value="all">전체 상태</option>
        <option value="progress">심사·추진중</option>
        <option value="floor">막바지 단계</option>
        <option value="done">완료</option>
        <option value="dropped">종결/폐기</option>
      </select>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all">전체</div>
    <div class="tab" data-tab="bill">법안만</div>
    <div class="tab" data-tab="policy">국정과제·정책</div>
  </div>

  <div class="grid" id="grid"></div>
  </div>

  <div id="detailView" class="detail-page" style="display:none"></div>

  <footer class="pagefoot">
    <span>의안정보: <a href="https://open.assembly.go.kr" target="_blank">open.assembly.go.kr</a> · 국정과제: <a href="https://www.korea.kr/govVision/" target="_blank">korea.kr</a></span>
    <span><a href="./privacy.html">개인정보처리방침</a></span>
  </footer>

</div>

let DATA = JSON.parse(JSON.stringify(SAMPLE));

/* ============ 유틸 ============ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

function statusMeta(status){
  switch(status){
    case 'progress': return {cls:'badge-progress', label:'심사중'};
    case 'floor': return {cls:'badge-floor', label:'본회의'};
    case 'done': return {cls:'badge-done', label:'완료'};
    case 'dropped': return {cls:'badge-dropped', label:'종결'};
    case 'planning': return {cls:'badge-progress', label:'국정과제 추진중'};
    case 'detailed': return {cls:'badge-floor', label:'세부계획 발표'};
    case 'implemented': return {cls:'badge-done', label:'시행'};
    default: return {cls:'badge-progress', label:status};
  }
}
function bucketOf(status){
  if(status==='progress'||status==='planning') return 'progress';
  if(status==='floor'||status==='detailed') return 'floor';
  if(status==='done'||status==='implemented') return 'done';
  if(status==='dropped') return 'dropped';
  return 'progress';
}

/* ============ 통계 보드 ============ */
function renderBoard(){
  const bills = DATA.bills||[], policies = DATA.policies||[];
  const pending = bills.filter(b=>!['done','dropped'].includes(b.status)).length;
  const doneBills = bills.filter(b=>b.status==='done').length;
  const nearFinal = [...bills, ...policies].filter(i=>{
    const sp = stageProgress(i);
    return sp.total - 1 - sp.current <= 1 && !['done','dropped','implemented'].includes(i.status);
  }).length;

  $('#statBoard').innerHTML = `
    <div class="stat-cell"><div class="stat-num">${pending}<small>건</small></div><div class="stat-label">계류중인 법안</div></div>
    <div class="stat-cell"><div class="stat-num">${doneBills}<small>건</small></div><div class="stat-label">처리 완료 법안</div></div>
    <div class="stat-cell"><div class="stat-num">${policies.length}<small>건</small></div><div class="stat-label">추진중인 국정과제</div></div>
    <div class="stat-cell"><div class="stat-num">${nearFinal}<small>건</small></div><div class="stat-label">다음 단계 임박</div></div>
  `;
}

/* ============ 단계별 날짜 조회 & 결재선 스텝퍼 ============ */
function stageDate(history, idx){
  if(!history) return '';
  const h = history.find(x=>x.stage===idx);
  return h ? h.date : '';
}
function singleStepperHTML(stages, currentIdx, history){
  let html = `<div class="approval-line">`;
  stages.forEach((label,i)=>{
    const d = stageDate(history, i);
    html += `<div class="approval-cell ${i<=currentIdx?'done':''}">
      <div class="approval-box">${i<=currentIdx?'✓':(i+1)}</div>
      <div class="approval-label">${label}</div>${d?`<div class="approval-date">${d}</div>`:''}
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* ============ 히어로: 다가오는 변화 ============ */
function renderHero(){
  const all = [...(DATA.bills||[]), ...(DATA.policies||[])].filter(i=>!['done','dropped','implemented'].includes(i.status));
  const withProgress = all.map(item=>{
    const sp = stageProgress(item);
    const stages = item.kind==='bill' ? BILL_STAGES : POLICY_STAGES;
    return {item, remaining: sp.total-1-sp.current, current: sp.current, stages};
  }).filter(x=>x.remaining>=0);
  withProgress.sort((a,b)=>a.remaining-b.remaining);
  const top = withProgress.slice(0,3);

  const heroCard = $('#heroCard');
  if(top.length===0){
    heroCard.innerHTML = `<div class="ledger-list"><div class="ledger-empty">지금은 임박한 항목이 없어요.</div></div>`;
    return;
  }
  heroCard.innerHTML = `<div class="ledger-list">` + top.map((x,i)=>{
    const it = x.item;
    const kindLabel = it.kind==='bill' ? '법안' : '국정과제';
    const nextLabel = x.stages[x.current+1] || x.stages[x.current];
    return `<div class="ledger-row" onclick="location.hash='detail-${it.kind}-${it.id}'">
      <span class="ledger-code">${i+1}</span>
      <div class="ledger-body">
        <div class="ledger-title">${it.title}</div>
        <div class="ledger-next">${kindLabel} · ${it.category} — 다음 단계: <b>${nextLabel}</b></div>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

/* ============ 카드 렌더 ============ */
function stageProgress(item){
  if(item.kind==='bill'){
    return {total:BILL_STAGES.length, current:item.billStage};
  } else {
    return {total:POLICY_STAGES.length, current:item.policyStage};
  }
}

function cardHTML(item){
  const sm = statusMeta(item.status);
  const sp = stageProgress(item);
  let segs = '';
  for(let i=0;i<sp.total;i++) segs += `<div class="seg ${i<=sp.current?'on':''}"></div>`;

  let bodyMeta = '';
  if(item.kind==='bill'){
    bodyMeta = `<div class="progress-meta"><span>의안번호 ${item.billNo}</span><span>${item.proposeDate}</span></div>`;
  } else {
    bodyMeta = `<div class="progress-meta"><span>${item.ministry}</span><span>${item.announceDate} 발표</span></div>`;
  }

  const kindLabel = item.kind==='bill' ? '법안' : '정책';
  const footLoc = item.kind==='policy' ? item.ministry : item.committee;

  return `<div class="card" data-id="${item.id}" data-kind="${item.kind}">
    <div class="card-strip"></div>
    <div class="card-body">
      <div class="card-top">
        <span class="meta-line">${kindLabel} · ${item.category}</span>
        <span class="badge ${sm.cls}">${sm.label}</span>
      </div>
      <h3>${item.title}</h3>
      <p class="summary">${item.summary}</p>
      ${bodyMeta}
      <div class="mini-stages">${segs}</div>
      <div class="card-foot">
        <span>${footLoc}</span>
        <span></span>
      </div>
    </div>
  </div>`;
}

function currentFilters(){
  return {
    q: $('#searchInput').value.trim().toLowerCase(),
    cat: $('#categoryFilter').value,
    status: $('#statusFilter').value,
    tab: $('#tabs .tab.active').dataset.tab
  };
}

function renderGrid(){
  const f = currentFilters();
  let items = [...(DATA.bills||[]), ...(DATA.policies||[])];

  if(f.tab==='bill') items = items.filter(i=>i.kind==='bill');
  if(f.tab==='policy') items = items.filter(i=>i.kind==='policy');

  if(f.cat!=='all') items = items.filter(i=>i.category===f.cat);
  if(f.status!=='all') items = items.filter(i=>bucketOf(i.status)===f.status);
  if(f.q) items = items.filter(i=> (i.title+i.summary).toLowerCase().includes(f.q));

  const grid = $('#grid');
  if(items.length===0){
    grid.innerHTML = `<div class="empty"><b>조건에 맞는 결과가 없어요</b>다른 검색어나 필터를 시도해보세요.</div>`;
    return;
  }
  grid.innerHTML = items.map(cardHTML).join('');
  $$('.card').forEach(c=>c.addEventListener('click', ()=>{ location.hash = `detail-${c.dataset.kind}-${c.dataset.id}`; }));
}

/* ============ 카테고리 셀렉트 채우기 ============ */
function populateCategories(){
  const cats = Array.from(new Set([...(DATA.bills||[]), ...(DATA.policies||[])].map(i=>i.category)));
  const sel = $('#categoryFilter');
  sel.innerHTML = `<option value="all">전체 분야</option>` + cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

/* ============ 상세 페이지 (해시 라우팅: #detail-{kind}-{id}) ============ */
function findItem(kind, id){
  const arr = kind==='bill' ? DATA.bills : (DATA.policies||[]);
  return (arr||[]).find(i=>i.id===id);
}

function historyListHTML(item){
  if(!item.history || item.history.length===0) return '';
  const stages = item.kind==='bill' ? BILL_STAGES : POLICY_STAGES;
  const rows = item.history.map(h=>`
    <li><span class="hdate">${h.date}</span><span class="hlabel">${stages[h.stage]||''}</span><span class="hnote">${h.label}</span></li>
  `).join('');
  return `<div class="detail-section"><h3>${item.kind==='policy'?'추진 경과':'심사 경과'}</h3><ul class="history-list">${rows}</ul></div>`;
}

function renderDetailView(kind, id){
  const item = findItem(kind, id);
  if(!item){
    $('#detailView').innerHTML = `<button class="back-btn" onclick="location.hash=''">← 목록으로</button>
      <div class="empty"><b>항목을 찾을 수 없어요</b>목록으로 돌아가 다시 시도해주세요.</div>`;
    return;
  }
  const sm = statusMeta(item.status);

  let metaGrid = '';
  let stepperBlock = '';
  if(kind==='bill'){
    metaGrid = `
      <div class="detail-meta-grid">
        <div><span class="dl">의안번호</span><span class="dv">${item.billNo}</span></div>
        <div><span class="dl">제안일</span><span class="dv">${item.proposeDate}</span></div>
        <div><span class="dl">소관위원회</span><span class="dv">${item.committee}</span></div>
        <div><span class="dl">제안자</span><span class="dv">${item.proposer}</span></div>
      </div>`;
    stepperBlock = singleStepperHTML(BILL_STAGES, item.billStage, item.history);
  } else {
    metaGrid = `
      <div class="detail-meta-grid">
        <div><span class="dl">소관부처</span><span class="dv">${item.ministry}</span></div>
        <div><span class="dl">발표일</span><span class="dv">${item.announceDate}</span></div>
        <div><span class="dl">분야</span><span class="dv">${item.category}</span></div>
      </div>`;
    stepperBlock = singleStepperHTML(POLICY_STAGES, item.policyStage, item.history);
  }

  const reasonLabel = kind==='bill' ? '제안 이유' : '정책 배경';
  const reasonHTML = item.reason ? `<div class="detail-section"><h3>${reasonLabel}</h3><p>${item.reason}</p></div>` : '';
  const keyPointsHTML = (item.keyPoints && item.keyPoints.length) ? `<div class="detail-section"><h3>주요 내용</h3><ul class="keypoints">${item.keyPoints.map(k=>`<li>${k}</li>`).join('')}</ul></div>` : '';
  const relatedNewsHTML = (item.relatedNews && item.relatedNews.length) ? `<div class="detail-section"><h3>관련 최신 뉴스</h3><ul class="history-list">${item.relatedNews.map(n=>`<li><span class="hdate">${n.date||''}</span><a href="${n.url}" target="_blank" rel="noopener" class="hlabel" style="text-decoration:underline;">${n.title}</a></li>`).join('')}</ul></div>` : '';
  const sourceLabel = kind==='bill' ? '국회 원문에서 보기 ↗' : '정부 발표 원문 보기 ↗';
  const sourceHTML = item.sourceUrl ? `<a class="btn ghost" href="${item.sourceUrl}" target="_blank" rel="noopener" style="display:inline-block;padding:10px 16px;border:1px solid var(--border-strong);border-radius:6px;color:var(--text);text-decoration:none;font-size:13.5px;font-weight:600;">${sourceLabel}</a>` : '';
  const kindLabel = kind==='bill' ? '법안' : '정책';

  $('#detailView').innerHTML = `
    <button class="back-btn" onclick="location.hash=''">← 목록으로</button>
    <div class="detail-top">
      <span class="meta-line">${kindLabel} · ${item.category}</span>
      <span class="badge ${sm.cls}">${sm.label}${item.result?` · ${item.result}`:''}</span>
    </div>
    <h2 class="detail-title">${item.title}</h2>
    ${metaGrid}
    ${stepperBlock}
    ${reasonHTML}
    ${keyPointsHTML}
    ${historyListHTML(item)}
    ${relatedNewsHTML}
    ${sourceHTML}
  `;
  window.scrollTo({top:0, behavior:'instant'});
}

/* ============ 해시 라우팅: 목록 ↔ 상세 전환 ============ */
function route(){
  const m = location.hash.match(/^#detail-(bill|policy)-(.+)$/);
  if(m){
    renderDetailView(m[1], m[2]);
    $('#listView').style.display = 'none';
    $('#detailView').style.display = 'block';
  } else {
    $('#detailView').style.display = 'none';
    $('#listView').style.display = 'block';
  }
}
window.addEventListener('hashchange', route);

/* ============ 페이지 로드시 data.json 자동 불러오기 ============ */
async function autoLoadData(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('data.json 없음');
    const parsed = await res.json();
    if(!parsed.bills) throw new Error('형식 불일치');
    if(parsed.bills.length===0 && (!parsed.policies || parsed.policies.length===0)) throw new Error('빈 데이터');
    DATA = parsed;
  }catch(e){
    DATA = JSON.parse(JSON.stringify(SAMPLE));
  }
  populateCategories(); renderBoard(); renderHero(); renderGrid(); route();
}

/* ============ 이벤트 바인딩 ============ */
$('#searchInput').addEventListener('input', renderGrid);
$('#categoryFilter').addEventListener('change', renderGrid);
$('#statusFilter').addEventListener('change', renderGrid);
$$('#tabs .tab').forEach(t=>t.addEventListener('click', ()=>{
  $$('#tabs .tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  renderGrid();
}));

/* ============ 초기 실행 ============ */
autoLoadData();
</script>
</body>
</html>
