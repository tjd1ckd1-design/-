name: 법안·국정과제 데이터 자동 갱신

# 매일 정해진 시각 + 언제든 수동 실행 가능
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 UTC 21:00 = 한국시간(KST) 오전 6:00
  workflow_dispatch: {}     # Actions 탭에서 "Run workflow" 버튼으로 수동 실행 가능

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 국회 Open API에서 법안 데이터 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python assembly_fetch.py

      - name: 정책브리핑 API에서 국정과제 관련 최신 뉴스 수집
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python policy_fetch.py

      - name: 국가법령정보센터 API에서 현행법 목록 수집
        env:
          LAW_API_OC: ${{ secrets.LAW_API_OC }}
        run: python law_fetch.py

      - name: data.json 변경사항 커밋 및 배포
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 데이터 자동 갱신 (법안·국정과제·현행법)"
          file_pattern: "data.json raw_bills_sample.json"
